<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map - Priorités</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f8fafc;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  #canvas-wrapper {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    position: relative;
  }

  #canvas-wrapper.grabbing { cursor: grabbing; }

  #canvas {
    position: absolute;
    transform-origin: 0 0;
    will-change: transform;
  }

  svg.connections {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  svg.connections path {
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    opacity: 0.6;
    transition: opacity 0.2s;
  }

  .node {
    position: absolute;
    border-radius: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    z-index: 2;
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.04);
    z-index: 10;
  }

  .node.selected {
    outline: 2.5px solid #1e293b;
    outline-offset: 2px;
  }

  /* Root node */
  .node.root {
    background: linear-gradient(135deg, #1e293b, #334155);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    padding: 16px 28px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(30,41,59,0.18);
    letter-spacing: -0.01em;
  }

  /* Project nodes */
  .node.project {
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    padding: 10px 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
  }

  .node.project, .node.leaf { cursor: grab; }
  .node.project:active, .node.leaf:active { cursor: grabbing; }

  /* Leaf nodes */
  .node.leaf {
    background: #fff;
    font-size: 12.5px;
    font-weight: 500;
    color: #334155;
    padding: 8px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1.5px solid #e2e8f0;
  }

  .node.leaf:hover {
    border-color: #cbd5e1;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }

  /* Status dot */
  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-dot.done { background: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,0.25); }
  .status-dot.in_progress { background: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.25); }
  .status-dot.blocked { background: #ef4444; box-shadow: 0 0 0 2px rgba(239,68,68,0.25); }
  .status-dot.not_started { background: #9ca3af; box-shadow: 0 0 0 2px rgba(156,163,175,0.25); }

  /* Collapse toggle */
  .toggle-btn {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    z-index: 5;
    transition: transform 0.15s;
    color: inherit;
    line-height: 1;
  }

  .toggle-btn:hover { transform: scale(1.15); }

  /* Modal overlay */
  #detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  #detail-overlay.open { opacity: 1; pointer-events: auto; }

  /* Detail panel (modal) */
  #detail-panel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    width: 840px;
    max-height: 88vh;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.18), 0 2px 12px rgba(0,0,0,0.08);
    z-index: 100;
    overflow-y: auto;
    padding: 32px 32px 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #detail-panel.open {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  #detail-panel .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: #f1f5f9;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #64748b;
    transition: background 0.15s;
  }

  #detail-panel .close-btn:hover { background: #e2e8f0; }

  #detail-panel .panel-title {
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 6px;
    padding-right: 40px;
  }

  #detail-panel .panel-status {
    position: relative;
    display: inline-flex;
    margin-bottom: 20px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    border: 1.5px solid transparent;
    user-select: none;
  }
  .status-pill:hover { filter: brightness(0.95); }
  .status-pill .status-dot-pill {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-pill .status-chevron {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    margin-left: 2px;
    transition: transform 0.15s;
  }
  .status-pill.open .status-chevron { transform: rotate(180deg); }

  .status-pill.done { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }
  .status-pill.done .status-dot-pill { background: #059669; }
  .status-pill.in_progress { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
  .status-pill.in_progress .status-dot-pill { background: #2563eb; }
  .status-pill.blocked { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
  .status-pill.blocked .status-dot-pill { background: #dc2626; }
  .status-pill.not_started { background: #f9fafb; color: #6b7280; border-color: #e5e7eb; }
  .status-pill.not_started .status-dot-pill { background: #9ca3af; }

  .status-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    padding: 6px;
    z-index: 50;
    min-width: 170px;
    animation: fadeIn 0.12s ease;
  }
  .status-dropdown .status-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #334155;
    cursor: pointer;
    transition: background 0.1s;
  }
  .status-dropdown .status-option:hover { background: #f1f5f9; }
  .status-dropdown .status-option.active { background: #f1f5f9; font-weight: 600; }
  .status-dropdown .status-option .opt-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #detail-panel .section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #94a3b8;
    margin-bottom: 6px;
    margin-top: 20px;
  }

  #detail-panel .section-text {
    font-size: 14px;
    line-height: 1.6;
    color: #475569;
  }

  .prerequisites-box {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 8px 12px;
    background: #f0f9ff;
    border-left: 3px solid #3b82f6;
    border-radius: 0 8px 8px 0;
    margin-top: 8px;
    font-size: 13px;
    color: #1e40af;
    line-height: 1.5;
  }
  .prerequisites-box .prereq-text {
    flex: 1;
    min-width: 0;
  }
  .prereq-link {
    color: #2563eb;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 2px;
    cursor: pointer;
    font-weight: 600;
  }
  .prereq-link:hover {
    color: #1d4ed8;
    text-decoration-style: solid;
  }

  /* Confirm dialog */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.4);
    backdrop-filter: blur(4px);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  .confirm-box {
    background: white;
    border-radius: 16px;
    padding: 28px 32px 24px;
    width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .confirm-box .confirm-title {
    font-size: 15px;
    font-weight: 600;
    color: #1e293b;
    margin-bottom: 8px;
  }
  .confirm-box .confirm-msg {
    font-size: 13px;
    color: #64748b;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .confirm-box .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .confirm-box .confirm-actions button {
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.12s;
    border: none;
  }
  .confirm-box .btn-cancel {
    background: #f1f5f9;
    color: #475569;
  }
  .confirm-box .btn-cancel:hover {
    background: #e2e8f0;
  }
  .confirm-box .btn-danger {
    background: #ef4444;
    color: white;
  }
  .confirm-box .btn-danger:hover {
    background: #dc2626;
  }
  .prerequisites-box .prereq-icon {
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    stroke: #3b82f6;
    fill: none;
    stroke-width: 2;
    position: relative;
    top: 2px;
  }

  #detail-panel .blocker-box {
    background: #fef2f2;
    border-left: 3px solid #ef4444;
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    line-height: 1.5;
    color: #991b1b;
  }

  /* Controls */
  #controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    gap: 6px;
    z-index: 50;
  }

  #controls button {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    background: #fff;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  #controls button:hover { background: #f1f5f9; color: #1e293b; }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 16px;
    background: #fff;
    padding: 10px 18px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 1px solid #e2e8f0;
    z-index: 50;
    font-size: 12px;
    color: #64748b;
  }

  #legend .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #legend .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* Rich editor fields in panel */
  .rich-editor {
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    transition: border-color 0.15s;
    overflow: hidden;
  }

  .rich-editor:focus-within {
    border-color: #94a3b8;
    background: #fff;
  }

  .rich-editor.blocker-editor {
    border-color: #fecaca;
    background: #fef2f2;
  }

  .rich-editor.blocker-editor:focus-within {
    border-color: #ef4444;
    background: #fff5f5;
  }

  .rich-toolbar {
    display: none;
    align-items: center;
    gap: 2px;
    padding: 4px 6px;
    border-bottom: 1px solid #e2e8f0;
    background: #fff;
  }

  .rich-editor:focus-within .rich-toolbar { display: flex; }

  .rich-toolbar button {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    font-weight: 600;
  }

  .rich-toolbar button:hover { background: #f1f5f9; color: #1e293b; }
  .rich-toolbar button.active { background: #e2e8f0; color: #1e293b; }

  .rich-toolbar .sep {
    width: 1px;
    height: 18px;
    background: #e2e8f0;
    margin: 0 4px;
  }

  .rich-body {
    min-height: 40px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.6;
    color: #334155;
    outline: none;
    word-break: break-word;
  }

  .rich-body:empty::before {
    content: attr(data-placeholder);
    color: #94a3b8;
    pointer-events: none;
  }

  .blocker-editor .rich-body { color: #991b1b; }
  .blocker-editor .rich-body:empty::before { color: #e8a0a0; }

  .rich-body a { color: #2563eb; text-decoration: underline; }
  .rich-body ul, .rich-body ol { margin: 4px 0; padding-left: 20px; }
  .rich-body li { margin-bottom: 2px; }

  /* Sub-project row in modal */
  .subproject-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #f8fafc;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .subproject-row span:last-child {
    color: #334155;
    font-weight: 500;
  }

  /* Add sub-project button */
  .add-subproject-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 1.5px dashed #cbd5e1;
    border-radius: 8px;
    background: none;
    color: #64748b;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .add-subproject-btn:hover {
    border-color: #94a3b8;
    color: #334155;
    background: #f8fafc;
  }

  /* Add bar */
  .add-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
    margin-bottom: 8px;
  }

  .add-bar button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    color: #64748b;
    background: #fff;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .add-bar button:hover {
    border-color: #cbd5e1;
    color: #334155;
    background: #f8fafc;
  }

  .add-bar button svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Section header with remove */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    margin-bottom: 6px;
  }

  .section-header .section-label {
    margin: 0;
  }

  .section-header .remove-section {
    width: 20px;
    height: 20px;
    border: none;
    background: none;
    cursor: pointer;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: all 0.12s;
  }

  .section-header .remove-section:hover {
    background: #fef2f2;
    color: #ef4444;
  }

  .section-header .remove-section svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Checklist section */
  .checklist-section {
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    overflow: hidden;
  }

  .checklist-progress {
    height: 4px;
    background: #e2e8f0;
    border-radius: 0;
  }

  .checklist-progress-bar {
    height: 100%;
    background: #10b981;
    border-radius: 0;
    transition: width 0.2s ease;
  }

  .checklist-progress-label {
    font-size: 11px;
    color: #94a3b8;
    font-weight: 500;
    padding: 8px 12px 4px;
  }

  .checklist-items {
    padding: 4px 0;
  }

  .checklist-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    font-size: 13px;
    color: #334155;
    transition: background 0.1s;
  }

  .checklist-item:hover {
    background: #f1f5f9;
  }

  .checklist-item input[type="checkbox"] {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: #10b981;
  }

  .checklist-item .item-text {
    flex: 1;
    outline: none;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 13px;
    color: #334155;
    line-height: 1.5;
    min-width: 0;
  }

  .checklist-item .item-text.checked {
    text-decoration: line-through;
    color: #94a3b8;
  }

  .checklist-item .delete-item {
    width: 20px;
    height: 20px;
    border: none;
    background: none;
    cursor: pointer;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    opacity: 0;
    transition: all 0.12s;
    flex-shrink: 0;
  }

  .checklist-item:hover .delete-item {
    opacity: 1;
  }

  .checklist-item .delete-item:hover {
    color: #ef4444;
    background: #fef2f2;
  }

  .checklist-item.phase-separator {
    padding: 8px 12px 2px;
    gap: 0;
  }
  .checklist-item.phase-separator .phase-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #64748b;
    flex: 1;
  }
  .checklist-item.phase-separator:hover {
    background: none;
  }

  .checklist-item .delete-item svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Drag reorder */
  .drag-handle {
    width: 16px;
    height: 16px;
    cursor: grab;
    color: #cbd5e1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    transition: color 0.12s;
  }
  .drag-handle:hover { color: #94a3b8; }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle svg {
    width: 12px;
    height: 12px;
    fill: currentColor;
    stroke: none;
  }

  .checklist-item.dragging {
    opacity: 0.4;
    background: #e2e8f0;
  }

  .checklist-drop-indicator {
    height: 2px;
    background: #3b82f6;
    border-radius: 1px;
    margin: 0 12px;
    pointer-events: none;
    transition: opacity 0.1s;
  }

  .checklist-add {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 8px;
  }

  .checklist-add input {
    flex: 1;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 13px;
    color: #334155;
    outline: none;
    padding: 4px 0;
  }

  .checklist-add input::placeholder {
    color: #94a3b8;
  }

  /* Links section */
  .links-section {
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    overflow: hidden;
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.1s;
  }

  .link-row:last-of-type {
    border-bottom: none;
  }

  .link-row:hover {
    background: #f1f5f9;
  }

  .link-row .link-favicon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 3px;
  }

  .link-row .link-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .link-row .link-title {
    font-weight: 500;
    color: #334155;

// ──────────────────────────────────────────────
// UNDO SYSTEM
// ──────────────────────────────────────────────
const undoStack = [];
const MAX_UNDO = 20;

function cloneProjects() {
  return PROJECTS.map(p => ({
    id: p.id, title: p.title, color: p.color, status: p.status,
    description: p.description, prerequisites: p.prerequisites || "",
    blockers: p.blockers, notes: p.notes || "",
    checklist: (p.checklist || []).map(i => ({ ...i })),
    links: (p.links || []).map(l => ({ ...l })),
    children: p.children.map(c => ({
      id: c.id, title: c.title, status: c.status,
      description: c.description, prerequisites: c.prerequisites || "",
      blockers: c.blockers, notes: c.notes || "",
      checklist: (c.checklist || []).map(i => ({ ...i })),
      links: (c.links || []).map(l => ({ ...l }))
    }))
  }));
}

function pushUndo() {
  undoStack.push(cloneProjects());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

function popUndo() {
  if (undoStack.length === 0) return false;
  const snapshot = undoStack.pop();
  for (const sp of snapshot) {
    const target = PROJECTS.find(p => p.id === sp.id);
    if (!target) continue;
    target.status = sp.status;
    target.description = sp.description;
    target.prerequisites = sp.prerequisites;
    target.blockers = sp.blockers;
    target.notes = sp.notes;
    target.checklist = sp.checklist;
    target.links = sp.links;
    for (const sc of sp.children) {
      const tc = target.children.find(c => c.id === sc.id);
      if (!tc) continue;
      tc.status = sc.status;
      tc.description = sc.description;
      tc.prerequisites = sc.prerequisites;
      tc.blockers = sc.blockers;
      tc.notes = sc.notes;
      tc.checklist = sc.checklist;
      tc.links = sc.links;
    }
    // Remove sub-projects that didn't exist in the snapshot
    target.children = target.children.filter(c => sp.children.some(sc => sc.id === c.id));
  }
  saveToLocalStorage();
  render();
  if (currentPanelNodeId) {
    const n = findNodeById(currentPanelNodeId);
    if (n) openPanel(n);
  }
  showToast("Annulé");
  return true;
}

// ──────────────────────────────────────────────
// LAYOUT ENGINE (two-pass: position nodes, then measure & draw edges)
// ──────────────────────────────────────────────
const NODE_H = 40;
const LEAF_H = 36;
const GAP_Y = 28;
const GAP_X_PROJECT = 200;
const GAP_X_LEAF = 260;
const PROJECT_GAP_Y = 40;
const collapsedNodes = new Set();

function branchHeight(project) {
  const children = collapsedNodes.has(project.id) ? [] : project.children;
  const childCount = children.length;
  if (childCount === 0) return NODE_H;
  return NODE_H + 20 + childCount * (LEAF_H + GAP_Y) - GAP_Y;
}

// Cache side assignments so collapse/expand doesn't reshuffle projects
let _cachedSides = null;

function balanceSides(projects) {
  // Compute side assignment once using full (uncollapsed) heights
  if (!_cachedSides) {
    const fullHeights = projects.map(p => {
      const childCount = p.children.length;
      return childCount === 0 ? NODE_H : NODE_H + 20 + childCount * (LEAF_H + GAP_Y) - GAP_Y;
    });
    const indexed = projects.map((p, i) => ({ p, h: fullHeights[i] }));
    indexed.sort((a, b) => b.h - a.h);
    const leftIds = new Set(), rightIds = new Set();
    let lH = 0, rH = 0;
    for (const { p, h } of indexed) {
      if (rH <= lH) { rightIds.add(p.id); rH += h + PROJECT_GAP_Y; }
      else { leftIds.add(p.id); lH += h + PROJECT_GAP_Y; }
    }
    _cachedSides = { leftIds, rightIds };
  }

  // Use cached sides, but compute current heights (respecting collapsed state)
  const left = [], right = [];
  for (const p of projects) {
    if (_cachedSides.rightIds.has(p.id)) right.push(p);
    else left.push(p);
  }
  const leftH = left.reduce((sum, p) => sum + branchHeight(p) + PROJECT_GAP_Y, 0);
  const rightH = right.reduce((sum, p) => sum + branchHeight(p) + PROJECT_GAP_Y, 0);
  return { left, right, leftH, rightH };
}

function adjustColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
  const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
  return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
}

// ──────────────────────────────────────────────
// RENDERING (two-pass) + DRAG STATE
// ──────────────────────────────────────────────
const canvas = document.getElementById("canvas");
let selectedNodeId = null;

// Persistent across renders for drag + edge redraw
let _nodeElements = {};
let _edgeDefs = [];
const positionOverrides = {}; // nodeId -> { x, y } in canvas coords

function render() {
  const { left, right, leftH, rightH } = balanceSides(PROJECTS);
  const maxH = Math.max(leftH, rightH);
  const cx = 1500, cy = Math.max(500, maxH / 2 + 60);

  // Clear canvas
  canvas.innerHTML = '<svg class="connections"></svg>';

  // Reset shared state
  _nodeElements = {};
  _edgeDefs = [];
  const nodeElements = _nodeElements;
  const edgeDefs = _edgeDefs;

  // Helper: create node, applying position override if exists
  function createNode(id, x, y, type, data) {
    if (positionOverrides[id]) { x = positionOverrides[id].x; y = positionOverrides[id].y; }
    const el = document.createElement("div");
    el.className = `node ${type}`;
    el.dataset.id = id;
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.transform = "translate(-50%, -50%)";
    el._cx = x; el._cy = y; // store for drag
    return el;
  }

  // ── PASS 1: Create all node DOM elements ──

  // Root node
  const rootEl = createNode("root", cx, cy, "root", {});
  rootEl.textContent = ROOT_LABEL;
  canvas.appendChild(rootEl);
  nodeElements["root"] = { el: rootEl, side: null, cx: rootEl._cx, cy: rootEl._cy };

  // Right side projects + children
  let yOffset = cy - rightH / 2;
  for (const project of right) {
    const bh = branchHeight(project);
    const py = yOffset + bh / 2;
    const px = cx + GAP_X_PROJECT;

    const el = createNode(project.id, px, py, "project", project);
    el.style.background = `linear-gradient(135deg, ${project.color}, ${adjustColor(project.color, -15)})`;
    el.innerHTML = project.title;

    if (project.children.length > 0) {
      const toggle = document.createElement("div");
      toggle.className = "toggle-btn";
      toggle.style.borderColor = project.color;
      toggle.style.color = project.color;
      const isCollapsed = collapsedNodes.has(project.id);
      toggle.textContent = isCollapsed ? "+" : "\u2212";
      toggle.style.top = "50%";
      toggle.style.right = "-12px";
      toggle.style.transform = "translateY(-50%)";
      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        collapsedNodes.has(project.id) ? collapsedNodes.delete(project.id) : collapsedNodes.add(project.id);
        // Clear all position overrides since layout changed globally
        for (const key in positionOverrides) delete positionOverrides[key];
        savePositionsToLocalStorage();
        render();
      });
      el.appendChild(toggle);
    }
    el.addEventListener("click", () => openPanel(project));
    canvas.appendChild(el);
    nodeElements[project.id] = { el, side: "right", cx: el._cx, cy: el._cy };
    edgeDefs.push({ fromId: "root", toId: project.id, color: project.color });

    // Children (if not collapsed)
    if (!collapsedNodes.has(project.id) && project.children.length > 0) {
      let childY = yOffset + NODE_H + 10;
      for (const child of project.children) {
        const childX = px + GAP_X_LEAF;
        const cel = createNode(child.id, childX, childY, "leaf", child);
        cel.innerHTML = `<span class="status-dot ${child.status}"></span>${child.title}`;
        cel.addEventListener("click", () => openPanel(child));
        canvas.appendChild(cel);
        nodeElements[child.id] = { el: cel, side: "right", cx: cel._cx, cy: cel._cy, parentColor: project.color };
        edgeDefs.push({ fromId: project.id, toId: child.id, color: project.color });
        childY += LEAF_H + GAP_Y;
      }
    }
    yOffset += bh + PROJECT_GAP_Y;
  }

  // Left side projects + children
  yOffset = cy - leftH / 2;
  for (const project of left) {
    const bh = branchHeight(project);
    const py = yOffset + bh / 2;
    const px = cx - GAP_X_PROJECT;

    const el = createNode(project.id, px, py, "project", project);
    el.style.background = `linear-gradient(135deg, ${project.color}, ${adjustColor(project.color, -15)})`;
    el.innerHTML = project.title;

    if (project.children.length > 0) {
      const toggle = document.createElement("div");
      toggle.className = "toggle-btn";
      toggle.style.borderColor = project.color;
      toggle.style.color = project.color;
      const isCollapsed = collapsedNodes.has(project.id);
      toggle.textContent = isCollapsed ? "+" : "\u2212";
      toggle.style.top = "50%";
      toggle.style.left = "-12px";
      toggle.style.transform = "translateY(-50%)";
      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        collapsedNodes.has(project.id) ? collapsedNodes.delete(project.id) : collapsedNodes.add(project.id);
        // Clear all position overrides since layout changed globally
        for (const key in positionOverrides) delete positionOverrides[key];
        savePositionsToLocalStorage();
        render();
      });
      el.appendChild(toggle);
    }
    el.addEventListener("click", () => openPanel(project));
    canvas.appendChild(el);
    nodeElements[project.id] = { el, side: "left", cx: el._cx, cy: el._cy };
    edgeDefs.push({ fromId: "root", toId: project.id, color: project.color });

    if (!collapsedNodes.has(project.id) && project.children.length > 0) {
      let childY = yOffset + NODE_H + 10;
      for (const child of project.children) {
        const childX = px - GAP_X_LEAF;
        const cel = createNode(child.id, childX, childY, "leaf", child);
        cel.innerHTML = `<span class="status-dot ${child.status}"></span>${child.title}`;
        cel.addEventListener("click", () => openPanel(child));
        canvas.appendChild(cel);
        nodeElements[child.id] = { el: cel, side: "left", cx: cel._cx, cy: cel._cy, parentColor: project.color };
        edgeDefs.push({ fromId: project.id, toId: child.id, color: project.color });
        childY += LEAF_H + GAP_Y;
      }
    }
    yOffset += bh + PROJECT_GAP_Y;
  }

  // ── PASS 2: Measure actual node sizes and draw SVG edges ──
  // Use requestAnimationFrame so DOM has laid out the nodes
  requestAnimationFrame(() => {
    const svgEl = canvas.querySelector("svg.connections");

    for (const edge of edgeDefs) {
      const fromInfo = nodeElements[edge.fromId];
      const toInfo = nodeElements[edge.toId];
      if (!fromInfo || !toInfo) continue;

      // Node center is at (cx, cy) in canvas coordinates
      // Actual edges: center +/- offsetWidth/2 horizontally
      const fromW = fromInfo.el.offsetWidth;
      const fromH = fromInfo.el.offsetHeight;
      const toW = toInfo.el.offsetWidth;
      const toH = toInfo.el.offsetHeight;

      let startX, startY, endX, endY;

      if (toInfo.side === "right") {
        startX = fromInfo.cx + fromW / 2;  // right edge of parent
        startY = fromInfo.cy;
        endX = toInfo.cx - toW / 2;        // left edge of child
        endY = toInfo.cy;
      } else {
        startX = fromInfo.cx - fromW / 2;  // left edge of parent
        startY = fromInfo.cy;
        endX = toInfo.cx + toW / 2;        // right edge of child
        endY = toInfo.cy;
      }

      const gap = Math.abs(endX - startX);
      const dx = gap * 0.45;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      let d;
      if (toInfo.side === "right") {
        d = `M${startX},${startY} C${startX + dx},${startY} ${endX - dx},${endY} ${endX},${endY}`;
      } else {
        d = `M${startX},${startY} C${startX - dx},${startY} ${endX + dx},${endY} ${endX},${endY}`;
      }
      path.setAttribute("d", d);
      path.setAttribute("stroke", edge.color);
      svgEl.appendChild(path);
    }
  });

  // Set canvas size
  const allX = Object.values(nodeElements).map(n => n.cx);
  const allY = Object.values(nodeElements).map(n => n.cy);
  canvas.style.width = (Math.max(...allX) + 400) + "px";
  canvas.style.height = (Math.max(...allY) + 200) + "px";
  canvas._cx = cx;
  canvas._cy = cy;
}

// ──────────────────────────────────────────────
// REDRAW EDGES (used during drag)
// ──────────────────────────────────────────────
function redrawEdges() {
  const svgEl = canvas.querySelector("svg.connections");
  if (!svgEl) return;
  svgEl.innerHTML = "";
  for (const edge of _edgeDefs) {
    const fromInfo = _nodeElements[edge.fromId];
    const toInfo = _nodeElements[edge.toId];
    if (!fromInfo || !toInfo) continue;
    const fromW = fromInfo.el.offsetWidth;
    const toW = toInfo.el.offsetWidth;
    let startX, startY, endX, endY;
    if (toInfo.side === "right") {
      startX = fromInfo.cx + fromW / 2; startY = fromInfo.cy;
      endX = toInfo.cx - toW / 2; endY = toInfo.cy;
    } else {
      startX = fromInfo.cx - fromW / 2; startY = fromInfo.cy;
      endX = toInfo.cx + toW / 2; endY = toInfo.cy;
    }
    const gap = Math.abs(endX - startX);
    const dx = gap * 0.45;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    let d;
    if (toInfo.side === "right") {
      d = `M${startX},${startY} C${startX + dx},${startY} ${endX - dx},${endY} ${endX},${endY}`;
    } else {
      d = `M${startX},${startY} C${startX - dx},${startY} ${endX + dx},${endY} ${endX},${endY}`;
    }
    path.setAttribute("d", d);
    path.setAttribute("stroke", edge.color);
    svgEl.appendChild(path);
  }
}

// ──────────────────────────────────────────────
// DRAG & DROP
// ──────────────────────────────────────────────
let dragInfo = null;
const DRAG_THRESHOLD = 5;

canvas.addEventListener("mousedown", (e) => {
  const nodeEl = e.target.closest(".node:not(.root)");
  if (!nodeEl || e.target.closest(".toggle-btn")) return;
  const id = nodeEl.dataset.id;
  const info = _nodeElements[id];
  if (!info) return;
  e.stopPropagation();
  dragInfo = {
    id, el: nodeEl, info,
    startMouseX: e.clientX, startMouseY: e.clientY,
    startCx: info.cx, startCy: info.cy,
    moved: false
  };
});

// Find children node IDs for a project
function getChildNodeIds(projectId) {
  const project = PROJECTS.find(p => p.id === projectId);
  return project ? project.children.map(c => c.id) : [];
}

window.addEventListener("mousemove", (e) => {
  if (!dragInfo) return;
  const dx = e.clientX - dragInfo.startMouseX;
  const dy = e.clientY - dragInfo.startMouseY;
  if (!dragInfo.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;

  if (!dragInfo.moved) {
    // First move: snapshot children start positions
    dragInfo.childStarts = {};
    for (const cid of getChildNodeIds(dragInfo.id)) {
      const ci = _nodeElements[cid];
      if (ci) dragInfo.childStarts[cid] = { cx: ci.cx, cy: ci.cy };
    }
  }
  dragInfo.moved = true;

  const ddx = dx / scale;
  const ddy = dy / scale;

  // Move the dragged node
  const newCx = dragInfo.startCx + ddx;
  const newCy = dragInfo.startCy + ddy;
  dragInfo.info.cx = newCx;
  dragInfo.info.cy = newCy;
  dragInfo.el.style.left = newCx + "px";
  dragInfo.el.style.top = newCy + "px";
  dragInfo.el.style.zIndex = "20";

  // Move children with the parent
  for (const [cid, start] of Object.entries(dragInfo.childStarts)) {
    const ci = _nodeElements[cid];
    if (!ci) continue;
    ci.cx = start.cx + ddx;
    ci.cy = start.cy + ddy;
    ci.el.style.left = ci.cx + "px";
    ci.el.style.top = ci.cy + "px";
  }

  redrawEdges();
});

window.addEventListener("mouseup", (e) => {
  if (!dragInfo) return;
  if (dragInfo.moved) {
    dragInfo.el.style.zIndex = "";
    positionOverrides[dragInfo.id] = { x: dragInfo.info.cx, y: dragInfo.info.cy };
    // Save children positions too
    if (dragInfo.childStarts) {
      for (const cid of Object.keys(dragInfo.childStarts)) {
        const ci = _nodeElements[cid];
        if (ci) positionOverrides[cid] = { x: ci.cx, y: ci.cy };
      }
    }
    savePositionsToLocalStorage();
  }
  const wasDrag = dragInfo.moved;
  dragInfo = null;
  if (wasDrag) {
    e.stopPropagation();
    window.addEventListener("click", (ev) => ev.stopPropagation(), { capture: true, once: true });
  }
});

function savePositionsToLocalStorage() {
  localStorage.setItem("mindmap-positions", JSON.stringify(positionOverrides));
}

function loadPositionsFromLocalStorage() {
  const raw = localStorage.getItem("mindmap-positions");
  if (!raw) return;
  try { Object.assign(positionOverrides, JSON.parse(raw)); } catch (e) {}
}

function resetPositions() {
  for (const key in positionOverrides) delete positionOverrides[key];
  localStorage.removeItem("mindmap-positions");
  render();
  resetView();
  showToast("Positions réinitialisées");
}

function findNodeById(id) {
  for (const p of PROJECTS) {
    if (p.id === id) return p;
    for (const c of p.children) {
      if (c.id === id) return c;
    }
  }
  return null;
}

// ──────────────────────────────────────────────
// LOCAL STORAGE
// ──────────────────────────────────────────────
const STORAGE_KEY = "mindmap-priorities-data";
const DATA_VERSION = 10;
const VERSION_KEY = "mindmap-data-version";

function saveToLocalStorage() {
  const data = PROJECTS.map(p => ({
    id: p.id, title: p.title, color: p.color, status: p.status,
    description: p.description, prerequisites: p.prerequisites || "", blockers: p.blockers, notes: p.notes || "",
    checklist: p.checklist || [], links: p.links || [],
    children: p.children.map(c => ({
      id: c.id, title: c.title, status: c.status,
      description: c.description, prerequisites: c.prerequisites || "", blockers: c.blockers, notes: c.notes || "",
      checklist: c.checklist || [], links: c.links || []
    }))
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  localStorage.setItem(VERSION_KEY, DATA_VERSION);
}

function loadFromLocalStorage() {
  const storedVersion = parseInt(localStorage.getItem(VERSION_KEY) || "0");
  if (storedVersion < DATA_VERSION) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem("mindmap-positions");
    localStorage.setItem(VERSION_KEY, DATA_VERSION);
    return false;
  }
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return false;
  try {
    const saved = JSON.parse(raw);
    for (const sp of saved) {
      const target = PROJECTS.find(p => p.id === sp.id);
      if (!target) continue;
      target.status = sp.status;
      target.description = sp.description;
      target.prerequisites = sp.prerequisites || "";
      target.blockers = sp.blockers;
      // Migrate: old "progress" field becomes "notes"
      target.notes = sp.notes || sp.progress || "";
      target.checklist = sp.checklist || [];
      target.links = sp.links || [];
      for (const sc of sp.children) {
        const tc = target.children.find(c => c.id === sc.id);
        if (!tc) continue;
        tc.status = sc.status;
        tc.description = sc.description;
        tc.prerequisites = sc.prerequisites || "";
        tc.blockers = sc.blockers;
        tc.notes = sc.notes || sc.progress || "";
        tc.checklist = sc.checklist || [];
        tc.links = sc.links || [];
      }
    }
    return true;
  } catch (e) { return false; }
}

function exportJSON() {
  const data = PROJECTS.map(p => ({

// ──────────────────────────────────────────────
// DETAIL PANEL (editable)
// ──────────────────────────────────────────────
let currentPanelNodeId = null;

let _savedRange = null;

function saveSelection() {
  const sel = window.getSelection();
  if (sel.rangeCount > 0) _savedRange = sel.getRangeAt(0).cloneRange();
}

function restoreSelection() {
  if (_savedRange) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(_savedRange);
  }
}

function getParentAnchor() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return null;
  let node = sel.anchorNode;
  while (node && node.nodeType !== 1) node = node.parentNode;
  while (node && node.tagName !== "A") node = node.parentNode;
  return node;
}

let _linkPopover = null;
let _linkEditorEl = null;

function createLinkPopover() {
  const popover = document.createElement("div");
  popover.className = "link-popover";
  popover.innerHTML = `
    <label>Lien <span class="required">*</span></label>
    <input type="url" class="link-url" placeholder="Coller un lien">
    <label>Texte d'affichage (optionnel)</label>
    <input type="text" class="link-text" placeholder="">
    <div class="hint">Titre ou description du lien</div>
    <div class="popover-actions">
      <button class="btn-cancel" type="button">Annuler</button>
      <button class="btn-insert" type="button">Insérer</button>
    </div>
  `;
  document.body.appendChild(popover);

  popover.querySelector(".btn-cancel").addEventListener("click", () => {
    popover.classList.remove("visible");
  });

  popover.querySelector(".btn-insert").addEventListener("click", () => {
    const url = popover.querySelector(".link-url").value.trim();
    const text = popover.querySelector(".link-text").value.trim();
    if (!url) return;
    restoreSelection();
    if (text && !window.getSelection().toString()) {
      document.execCommand("insertHTML", false, `<a href="${url}" target="_blank">${text}</a>`);
    } else {
      document.execCommand("createLink", false, url);
    }
    popover.classList.remove("visible");
    if (_linkEditorEl) {
      const field = _linkEditorEl.id.replace("field-", "");
      const n = findNodeById(currentPanelNodeId);
      if (n) { n[field] = _linkEditorEl.innerHTML; saveToLocalStorage(); }
    }
  });

  // Enter key in URL field triggers insert
  popover.querySelector(".link-url").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); popover.querySelector(".btn-insert").click(); }
  });

  return popover;
}

function openLinkPopover(editorEl) {
  const existing = getParentAnchor();
  if (existing) {
    document.execCommand("unlink");
    return;
  }
  saveSelection();
  _linkEditorEl = editorEl;
  const sel = window.getSelection();
  const selectedText = sel.toString();
  if (!_linkPopover) _linkPopover = createLinkPopover();
  _linkPopover.querySelector(".link-url").value = "";
  _linkPopover.querySelector(".link-text").value = selectedText;
  _linkPopover.classList.add("visible");
  _linkPopover.querySelector(".link-url").focus();
}

function hasContent(val) {
  if (!val) return false;
  if (typeof val === "string") {
    const stripped = val.replace(/<[^>]*>/g, "").trim();
    return stripped.length > 0;
  }
  if (Array.isArray(val)) return val.length > 0;
  return false;
}

function buildChecklistHTML(checklist) {
  const items = checklist || [];
  const done = items.filter(i => i.done).length;
  const total = items.length;
  const isSep = t => t.startsWith("──") || t.startsWith("--");
  const realItems = items.filter(i => !isSep(i.text));
  const realDone = realItems.filter(i => i.done).length;
  const realTotal = realItems.length;
  const pct = realTotal > 0 ? Math.round((realDone / realTotal) * 100) : 0;
  let html = `<div class="checklist-section">`;
  html += `<div class="checklist-progress-label">${realDone}/${realTotal} terminé${realDone > 1 ? "s" : ""}</div>`;
  html += `<div class="checklist-progress"><div class="checklist-progress-bar" style="width:${pct}%"></div></div>`;
  html += `<div class="checklist-items">`;
  const gripSVG = `<span class="drag-handle" title="Glisser pour réordonner"><svg viewBox="0 0 16 16"><circle cx="5" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="13" r="1.5"/><circle cx="11" cy="13" r="1.5"/></svg></span>`;
  items.forEach((item, idx) => {
    if (isSep(item.text)) {
      const label = item.text.replace(/^[─\-\s]+|[─\-\s]+$/g, "").trim();
      html += `<div class="checklist-item phase-separator" data-idx="${idx}">${gripSVG}<span class="phase-label">${escapeHtml(label)}</span></div>`;
    } else {
      html += `<div class="checklist-item" data-idx="${idx}">`;
      html += gripSVG;
      html += `<input type="checkbox" ${item.done ? "checked" : ""} onchange="toggleChecklistItem(${idx})">`;
      html += `<span class="item-text ${item.done ? "checked" : ""}" contenteditable="true" data-idx="${idx}">${escapeHtml(item.text)}</span>`;
      html += `<button class="delete-item" onclick="deleteChecklistItem(${idx})" title="Supprimer"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
      html += `</div>`;
    }
  });
  html += `</div>`;
  html += `<div class="checklist-add"><input type="text" placeholder="Ajouter un \u00e9l\u00e9ment..." onkeydown="if(event.key==='Enter'){addChecklistItem(this);event.preventDefault();}"></div>`;
  html += `</div>`;
  return html;
}

function buildLinksHTML(links) {

  let html = `<div class="links-section">`;
  for (let i = 0; i < items.length; i++) {
    const link = items[i];
    const displayUrl = link.url.replace(/^https?:\/\//, "").substring(0, 50);

    html += `<div class="link-url-display">${escapeHtml(displayUrl)}</div>`;

  }
  if (!hasContent(node.notes)) {
    buttons.push(`<button onclick="addSection('notes')"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> Notes</button>`);
  }
  if (buttons.length === 0) return "";
  return `<div class="add-bar">${buttons.join("")}</div>`;
}

function showConfirm(title, msg, onConfirm) {
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `<div class="confirm-box">
    <div class="confirm-title">${title}</div>
    <div class="confirm-msg">${msg}</div>
    <div class="confirm-actions">
      <button class="btn-cancel">Annuler</button>
      <button class="btn-danger">Supprimer</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector(".btn-cancel").onclick = () => overlay.remove();
  overlay.querySelector(".btn-danger").onclick = () => { overlay.remove(); onConfirm(); };
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
}

function removeSection(key) {
  const n = findNodeById(currentPanelNodeId);
  if (!n) return;
  const labels = { blockers: "Bloqueurs", checklist: "Checklist", links: "Liens", notes: "Notes" };
  const hasContent = (key === "checklist" && n.checklist && n.checklist.length > 0)
    || (key === "links" && n.links && n.links.length > 0)
    || (key === "blockers" && n.blockers)
    || (key === "notes" && n.notes);
  const doRemove = () => {
    pushUndo();
    if (key === "blockers") n.blockers = "";
    else if (key === "checklist") n.checklist = [];
    else if (key === "links") n.links = [];
    else if (key === "notes") n.notes = "";
    if (n._showSections) n._showSections.delete(key);
    saveToLocalStorage();
    openPanel(n);
  };
  if (hasContent) {
    showConfirm("Supprimer " + labels[key] + " ?", "Cette action supprimera tout le contenu de cette section.", doRemove);
  } else {
    doRemove();
  }
}

function addSection(key) {
  const n = findNodeById(currentPanelNodeId);
  if (!n) return;
  if (key === "checklist" && !n.checklist) n.checklist = [];
  if (key === "links" && !n.links) n.links = [];
  // For blockers/notes, we just show the editor (they start empty)
  // We need a flag to force-show these sections even when empty
  if (!n._showSections) n._showSections = new Set();
  n._showSections.add(key);
  saveToLocalStorage();
  openPanel(n);
}

function autoStatusFromChecklist(n) {
  if (!n || !n.checklist || n.checklist.length === 0) return;
  if (n.blockers) return; // don't override blocked status
  const isSep = t => t.startsWith("──") || t.startsWith("--");
  const real = n.checklist.filter(i => !isSep(i.text));
  if (real.length === 0) return;
  const done = real.filter(i => i.done).length;
  if (done === 0) n.status = "not_started";
  else if (done === real.length) n.status = "done";
  else n.status = "in_progress";
}

function toggleChecklistItem(idx) {
  const n = findNodeById(currentPanelNodeId);
  if (!n || !n.checklist || !n.checklist[idx]) return;
  pushUndo();
  n.checklist[idx].done = !n.checklist[idx].done;
  autoStatusFromChecklist(n);
  saveToLocalStorage();
  openPanel(n);
}

function deleteChecklistItem(idx) {
  const n = findNodeById(currentPanelNodeId);
  if (!n || !n.checklist) return;
  pushUndo();
  n.checklist.splice(idx, 1);
  saveToLocalStorage();
  openPanel(n);
}

function addChecklistItem(input) {
  const text = input.value.trim();
  if (!text) return;
  const n = findNodeById(currentPanelNodeId);
  if (!n) return;
  pushUndo();
  if (!n.checklist) n.checklist = [];
  n.checklist.push({ text, done: false });
  saveToLocalStorage();
  openPanel(n);
}

function deleteLinkItem(idx) {
  const n = findNodeById(currentPanelNodeId);
  if (!n || !n.links) return;
  pushUndo();
  n.links.splice(idx, 1);
  saveToLocalStorage();
  openPanel(n);
}

function addLinkItem() {
  const urlInput = document.getElementById("link-add-url");
  const titleInput = document.getElementById("link-add-title");
  const url = urlInput.value.trim();
  if (!url) return;
  const text = titleInput.value.trim();
  const n = findNodeById(currentPanelNodeId);
  if (!n) return;
  pushUndo();
  if (!n.links) n.links = [];
  n.links.push({ url, text: text || "" });
  saveToLocalStorage();
  openPanel(n);
}

// ──────────────────────────────────────────────
// CHECKLIST DRAG REORDER
// ──────────────────────────────────────────────
let clDrag = null;

function initChecklistDrag() {
  const panel = document.getElementById("detail-panel");
  panel.addEventListener("mousedown", clDragStart);
  panel.addEventListener("touchstart", clDragStart, { passive: false });
}

function clDragStart(e) {
  const handle = e.target.closest(".drag-handle");
  if (!handle) return;
  const item = handle.closest(".checklist-item");
  if (!item) return;
  e.preventDefault();
  const idx = parseInt(item.dataset.idx);
  const container = item.closest(".checklist-items");
  if (!container) return;

  const rect = item.getBoundingClientRect();
  clDrag = {
    idx,
    el: item,
    container,
    startY: (e.touches ? e.touches[0] : e).clientY,
    itemH: rect.height,
    moved: false
  };
  item.classList.add("dragging");

  window.addEventListener("mousemove", clDragMove);
  window.addEventListener("mouseup", clDragEnd);
  window.addEventListener("touchmove", clDragMove, { passive: false });
  window.addEventListener("touchend", clDragEnd);
}

function clDragMove(e) {
  if (!clDrag) return;
  e.preventDefault();
  const clientY = (e.touches ? e.touches[0] : e).clientY;
  const dy = clientY - clDrag.startY;
  if (!clDrag.moved && Math.abs(dy) < 4) return;
  clDrag.moved = true;

  // Remove any existing drop indicator
  const old = clDrag.container.querySelector(".checklist-drop-indicator");
  if (old) old.remove();

  // Find target index based on mouse position
  const items = Array.from(clDrag.container.querySelectorAll(".checklist-item"));
  let targetIdx = clDrag.idx;
  for (let i = 0; i < items.length; i++) {
    const r = items[i].getBoundingClientRect();
    const mid = r.top + r.height / 2;
    if (clientY < mid) { targetIdx = i; break; }
    targetIdx = i + 1;
  }
  clDrag.targetIdx = targetIdx;

  // Insert drop indicator
  const indicator = document.createElement("div");
  indicator.className = "checklist-drop-indicator";
  if (targetIdx < items.length) {
    clDrag.container.insertBefore(indicator, items[targetIdx]);
  } else {
    clDrag.container.appendChild(indicator);
  }
}

function clDragEnd(e) {
  if (!clDrag) return;
  window.removeEventListener("mousemove", clDragMove);
  window.removeEventListener("mouseup", clDragEnd);
  window.removeEventListener("touchmove", clDragMove);
  window.removeEventListener("touchend", clDragEnd);

  clDrag.el.classList.remove("dragging");
  const old = clDrag.container.querySelector(".checklist-drop-indicator");
  if (old) old.remove();

  if (clDrag.moved && clDrag.targetIdx !== undefined && clDrag.targetIdx !== clDrag.idx) {
    const n = findNodeById(currentPanelNodeId);
    if (n && n.checklist) {
      let from = clDrag.idx;
      let to = clDrag.targetIdx;
      pushUndo();
      const [moved] = n.checklist.splice(from, 1);
      if (to > from) to--;
      n.checklist.splice(to, 0, moved);
      saveToLocalStorage();
      openPanel(n);
    }
  }
  clDrag = null;
}

function openPanel(node) {
  currentPanelNodeId = node.id;
  const panel = document.getElementById("detail-panel");
  document.getElementById("panel-title").textContent = node.title;

  // Status dropdown (only for sub-nodes, not project-level)
  const STATUS_COLORS = { done: "#059669", in_progress: "#2563eb", blocked: "#dc2626", not_started: "#9ca3af" };
  const isProject = PROJECTS.some(p => p.id === node.id);
  const statusEl = document.getElementById("panel-status");
  statusEl.className = "panel-status";
  if (isProject) {
    statusEl.innerHTML = "";
  } else {
    statusEl.innerHTML = `<div class="status-pill ${node.status}" id="status-pill">
      <span class="status-dot-pill"></span>
      <span>${STATUS_LABELS[node.status]}</span>
      <svg class="status-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>`;
    const pill = document.getElementById("status-pill");
    pill.addEventListener("click", (e) => {
      e.stopPropagation();
      const existing = document.querySelector(".status-dropdown");
      if (existing) { existing.remove(); pill.classList.remove("open"); return; }
      pill.classList.add("open");
      let dd = document.createElement("div");
      dd.className = "status-dropdown";
      for (const [val, label] of Object.entries(STATUS_LABELS)) {
        dd.innerHTML += `<div class="status-option ${val === node.status ? "active" : ""}" data-val="${val}">
          <span class="opt-dot" style="background:${STATUS_COLORS[val]}"></span>${label}
        </div>`;
      }
      statusEl.appendChild(dd);
      dd.querySelectorAll(".status-option").forEach(opt => {
        opt.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const n = findNodeById(currentPanelNodeId);
          if (n) { pushUndo(); n.status = opt.dataset.val; saveToLocalStorage(); render(); openPanel(n); }
        });
      });
      const closeDD = (ev) => { if (!statusEl.contains(ev.target)) { dd.remove(); pill.classList.remove("open"); document.removeEventListener("click", closeDD); } };
      setTimeout(() => document.addEventListener("click", closeDD), 0);
    });
  }

  // Ensure new fields exist
  if (!node.checklist) node.checklist = [];
  if (!node.links) node.links = [];
  if (node.notes === undefined) node.notes = "";

  // Determine which optional sections to show
  const showBlockers = hasContent(node.blockers) || (node._showSections && node._showSections.has("blockers"));
  const showChecklist = hasContent(node.checklist) || (node._showSections && node._showSections.has("checklist"));
  const showLinks = hasContent(node.links) || (node._showSections && node._showSections.has("links"));
  const showNotes = hasContent(node.notes) || (node._showSections && node._showSections.has("notes"));

  // Body
  let bodyHTML = "";

  // Description (always visible)
  bodyHTML += `<div class="section-label" style="margin-top:12px;">Description</div>`;
  bodyHTML += richEditorHTML("field-description", "", "Ajouter une description...", node.description || "");

  // Prerequisites (always visible when present)
  if (node.prerequisites) {
    bodyHTML += `<div class="section-label" style="margin-top:16px;color:#3b82f6;text-transform:none;">Prérequis</div>`;
    bodyHTML += `<div class="prerequisites-box">`;
    bodyHTML += `<svg class="prereq-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>`;
    // Auto-link node titles in prerequisites text
    let prereqHTML = escapeHtml(node.prerequisites);
    for (const p of PROJECTS) {
      const allNodes = [p, ...p.children];
      for (const n of allNodes) {
        if (n.id === node.id) continue;
        const escaped = escapeHtml(n.title);
        if (prereqHTML.includes(escaped)) {
          prereqHTML = prereqHTML.replace(escaped, `<a class="prereq-link" href="#" onclick="event.preventDefault();openPanelById('${n.id}')">${escaped}</a>`);
        }
      }
    }
    bodyHTML += `<span class="prereq-text" id="field-prerequisites">${prereqHTML}</span>`;
    bodyHTML += `</div>`;
  }

  // Optional sections (shown if has content or user clicked Add)
  if (showBlockers) {
    bodyHTML += sectionHeaderHTML("Bloqueurs", "blockers");
    bodyHTML += richEditorHTML("field-blockers", "blocker-editor", "Aucun bloqueur", node.blockers || "");
  }

  if (showChecklist) {
    bodyHTML += sectionHeaderHTML("Checklist", "checklist");
    bodyHTML += buildChecklistHTML(node.checklist);
  }

  if (showLinks) {
    bodyHTML += sectionHeaderHTML("Liens", "links");
    bodyHTML += buildLinksHTML(node.links);
  }

  if (showNotes) {
    bodyHTML += sectionHeaderHTML("Notes", "notes");
    bodyHTML += richEditorHTML("field-notes", "", "Notes diverses...", node.notes || "");
  }

  // Add bar (shows buttons only for sections NOT currently visible)
  const addBarNode = {
    blockers: showBlockers ? "shown" : "",
    checklist: showChecklist ? [1] : [],
    links: showLinks ? [1] : [],
    notes: showNotes ? "shown" : ""
  };
  bodyHTML += addBarHTML(addBarNode);

  // Sub-projects (only for project-level nodes)
  if (isProject) {
    bodyHTML += `<div class="section-label" style="margin-top:20px;">Sous-projets${node.children.length > 0 ? " (" + node.children.length + ")" : ""}</div>`;
    if (node.children.length > 0) {
      bodyHTML += `<div style="display:flex;flex-direction:column;gap:6px;margin-top:4px;">`;
      for (const child of node.children) {
        bodyHTML += `<div class="subproject-row" onclick="openPanelById('${child.id}')">`;
        bodyHTML += `<span class="status-dot ${child.status}"></span>`;
        bodyHTML += `<span>${escapeHtml(child.title)}</span>`;
        bodyHTML += `</div>`;
      }
      bodyHTML += `</div>`;
    }
    bodyHTML += `<div style="margin-top:8px;">`;
    bodyHTML += `<button class="add-subproject-btn" onclick="promptAddSubproject()">`;
    bodyHTML += `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
    bodyHTML += ` Ajouter un sous-projet</button>`;
    bodyHTML += `</div>`;
  }

  document.getElementById("panel-body").innerHTML = bodyHTML;

  // Wire up auto-save on rich editor fields
  const richFields = [
    { key: "description", id: "field-description" },
    { key: "blockers", id: "field-blockers" },
    { key: "notes", id: "field-notes" }
  ];
  for (const { key, id } of richFields) {
    const editor = document.getElementById(id);
    if (editor) {
      editor.addEventListener("input", () => {
        const n = findNodeById(currentPanelNodeId);
        if (n) { n[key] = editor.innerHTML; saveToLocalStorage(); }
      });
    }
  }

  // Wire up prerequisites editing
  const prereqEl = document.getElementById("field-prerequisites");
  if (prereqEl) {
    prereqEl.addEventListener("input", () => {
      const n = findNodeById(currentPanelNodeId);
      if (n) { n.prerequisites = prereqEl.textContent; saveToLocalStorage(); }
    });
  }

  // Wire up checklist item text editing
  document.querySelectorAll(".checklist-item .item-text").forEach(el => {
    el.addEventListener("input", () => {
      const idx = parseInt(el.dataset.idx);
      const n = findNodeById(currentPanelNodeId);
      if (n && n.checklist && n.checklist[idx]) {
        n.checklist[idx].text = el.textContent;
        saveToLocalStorage();
      }
    });
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    });
  });

  // Enter key on link URL input
  const linkUrlInput = document.getElementById("link-add-url");
  if (linkUrlInput) {
    linkUrlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); addLinkItem(); }
    });
  }

  document.getElementById("detail-overlay").classList.add("open");
  panel.classList.add("open");
  selectedNodeId = node.id;
}

function promptAddSubproject() {
  const title = prompt("Nom du sous-projet :");
  if (!title || !title.trim()) return;
  const project = PROJECTS.find(p => p.id === currentPanelNodeId);
  if (!project) return;
  pushUndo();
  const id = title.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/-+$/, "");
  project.children.push({
    id: id + "-" + Date.now(),
    title: title.trim(),
    status: "not_started",
    description: "",
    blockers: "",
    notes: "",
    checklist: [],
    links: []
  });
  _cachedSides = null; // Reset side cache since branch heights changed
  for (const key in positionOverrides) delete positionOverrides[key];
  savePositionsToLocalStorage();
  saveToLocalStorage();
  render();
  openPanel(project);
}

function openPanelById(id) {
  const node = findNodeById(id);
  if (node) openPanel(node);
}

function closePanel() {
  document.getElementById("detail-overlay").classList.remove("open");
  document.getElementById("detail-panel").classList.remove("open");
  selectedNodeId = null;
  currentPanelNodeId = null;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// ──────────────────────────────────────────────
// ZOOM & PAN
// ──────────────────────────────────────────────
let scale = 1;
let panX = 0, panY = 0;
let isPanning = false;
let startX, startY;

const wrapper = document.getElementById("canvas-wrapper");

function updateTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function resetView() {
  scale = 0.85;
  const cx = canvas._cx || 1500;
  const cy = canvas._cy || 500;
  panX = window.innerWidth / 2 - cx * scale;
  panY = window.innerHeight / 2 - cy * scale;
  updateTransform();
}

function zoomIn() {
  const oldScale = scale;
  scale = Math.min(2, scale * 1.15);
  // Zoom toward center of viewport
  const vcx = window.innerWidth / 2;
  const vcy = window.innerHeight / 2;
  panX = vcx - (vcx - panX) * (scale / oldScale);
  panY = vcy - (vcy - panY) * (scale / oldScale);
  updateTransform();
}

function zoomOut() {
  const oldScale = scale;
  scale = Math.max(0.2, scale / 1.15);
  const vcx = window.innerWidth / 2;
  const vcy = window.innerHeight / 2;
  panX = vcx - (vcx - panX) * (scale / oldScale);
  panY = vcy - (vcy - panY) * (scale / oldScale);
  updateTransform();
}

wrapper.addEventListener("wheel", (e) => {
  e.preventDefault();
  const oldScale = scale;
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  scale = Math.max(0.2, Math.min(2, scale * delta));
  // Zoom toward mouse position
  panX = e.clientX - (e.clientX - panX) * (scale / oldScale);
  panY = e.clientY - (e.clientY - panY) * (scale / oldScale);
  updateTransform();
}, { passive: false });

wrapper.addEventListener("mousedown", (e) => {
  if (e.target.closest(".node") || e.target.closest(".toggle-btn")) return;
  isPanning = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  wrapper.classList.add("grabbing");
});

window.addEventListener("mousemove", (e) => {
  if (!isPanning) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  updateTransform();
});

window.addEventListener("mouseup", () => {
  isPanning = false;
  wrapper.classList.remove("grabbing");
});

// Keyboard shortcuts (disabled when typing in fields)
document.addEventListener("keydown", (e) => {
  const inField = e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.isContentEditable;
  if (e.key === "Escape") { if (inField) e.target.blur(); else closePanel(); }
  if (e.key === "z" && (e.metaKey || e.ctrlKey) && !e.shiftKey && !inField) {
    e.preventDefault();
    popUndo();
    return;
  }
  if (inField) return;
  if (e.key === "+" || e.key === "=") zoomIn();
  if (e.key === "-") zoomOut();
  if (e.key === "0") resetView();
});

// Close panel on click outside
wrapper.addEventListener("click", (e) => {
  if (!e.target.closest(".node") && !e.target.closest("#detail-panel")) {
    closePanel();
  }
});

// ──────────────────────────────────────────────
// DARK MODE
// ──────────────────────────────────────────────
const DARK_KEY = "mindmap-dark-mode";

function toggleDarkMode() {
  const isDark = document.body.classList.toggle("dark");
  localStorage.setItem(DARK_KEY, isDark ? "1" : "0");
  document.getElementById("dark-toggle").innerHTML = isDark ? "&#x2600;" : "&#x263D;";
}

function loadDarkMode() {
  if (localStorage.getItem(DARK_KEY) === "1") {
    document.body.classList.add("dark");
    document.getElementById("dark-toggle").innerHTML = "&#x2600;";
  }
}

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
loadFromLocalStorage();
loadPositionsFromLocalStorage();
loadDarkMode();
render();
resetView();
initChecklistDrag();
