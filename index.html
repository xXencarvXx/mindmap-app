<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map - Priorités</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/nodes.css">
<link rel="stylesheet" href="styles/modal.css">
<link rel="stylesheet" href="styles/dark.css">
</head>
<body>

<div id="canvas-wrapper">
  <div id="canvas">
    <svg class="connections"></svg>
  </div>
</div>

<div id="detail-overlay"></div>
<div id="detail-panel">
  <button class="close-btn">&#x2715;</button>
  <div class="panel-title" id="panel-title"></div>
  <div class="panel-status" id="panel-status"></div>
  <div id="panel-body"></div>
</div>

<div id="controls">
  <button id="btn-zoom-in" title="Zoom +">+</button>
  <button id="btn-zoom-out" title="Zoom -">&minus;</button>
  <button id="btn-reset-view" title="Recentrer">&#8962;</button>
  <button id="btn-export" title="Exporter JSON" style="font-size:13px;">&#x2913;</button>
  <button id="btn-reset-pos" title="Reset positions" style="font-size:11px;">&#x21BA;</button>
  <button id="btn-undo" title="Annuler (⌘Z)" style="font-size:14px;">&#x21B6;</button>
  <button id="dark-toggle" title="Mode sombre" style="font-size:15px;">&#x263D;</button>
</div>

<div class="toast" id="toast"></div>

<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div> Fait</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div> En cours</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> Bloqué</div>
  <div class="legend-item"><div class="legend-dot" style="background:#9ca3af"></div> Pas commencé</div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
